name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # A custom domain (www.aiyoo.store) is configured in Pages settings,
          # and GitHub serves custom domains at the root — not under /aiyo/,
          # which is what vite.config.ts's resolveBase() would pick by default
          # for this repo name. Override it here rather than in the config, so
          # a build without this var (e.g. a plain github.io/aiyo/ deploy)
          # still falls back to the repo-name-based path.
          VITE_BASE: /      
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
